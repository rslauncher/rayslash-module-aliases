[package]
name = "rayslash-module-aliases"
version = "1.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/rslauncher/rayslash-module-aliases"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

[package.metadata.component]
package = "rayslash:aliases"

[package.metadata.component.target]
path = "wit"
world = "module"
